# Reads the existing processed Kang X and split_B memberships; no new normalization.
training:
  batch_size: 256
  n_epochs: 200
  ae_epochs: 50
  flow_epochs: 150
  snapshot_freq: 10
data:
  dataset: RNA
  root: data
  size: 5000
  channel: 1
  n_classes: 7
  num_workers: 0
  logit_transform: false
  label_key: cell_type
  split_key: split_B
  train_split: train
  val_split: valid
  test_split: ood
model:
  latent_dim: 32
  hidden_features:
  - 256
  - 256
  flow_hidden_features:
  - 256
  - 256
optim:
  lr: 0.001
  weight_decay: 0.0001
sample:
  n_gen: 128
  steps: 100
evaluation:
  n_samples: 512
  projections: 128
  split: validation
