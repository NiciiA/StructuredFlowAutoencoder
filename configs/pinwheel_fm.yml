# Matched SFA dataset counts, splits and optimizer settings; smaller MLP capacity.
training:
  batch_size: 256
  n_epochs: 500
  ae_epochs: 100
  flow_epochs: 400
  snapshot_freq: 10
data:
  n_classes: 5
  dataset: PinWheel
  samplesize: 10000
  test_samplesize: 1000
  size: 2
  num_workers: 0
  logit_transform: true
  channel: 1
model:
  latent_dim: 1
  hidden_features:
  - 128
  - 128
  flow_hidden_features:
  - 128
  - 128
optim:
  lr: 0.0001
  weight_decay: 0.0001
sample:
  n_gen: 5000
  steps: 100
evaluation:
  n_samples: 512
  projections: 128
